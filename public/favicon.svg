<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="ringGrad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dde4f0"/>
    </radialGradient>
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8ef0"/>
      <stop offset="60%" stop-color="#7c6ff7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Q ring (white, thick stroke, no fill) -->
  <circle cx="46" cy="44" r="26" fill="none" stroke="url(#ringGrad)" stroke-width="11"
    filter="url(#glow)"
    style="paint-order:stroke"/>

  <!-- Inner shadow arc (dark navy, left side of ring) -->
  <path d="M 26 38 A 26 26 0 0 0 46 70" fill="none" stroke="#1a1a3a" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

  <!-- Tail — diagonal slash, gradient blue→purple -->
  <line x1="62" y1="62" x2="80" y2="84"
    stroke="url(#tailGrad)" stroke-width="10" stroke-linecap="round"
    filter="url(#glow)"/>

  <!-- Tail tip highlight -->
  <line x1="75" y1="78" x2="81" y2="86"
    stroke="#e0aaff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
