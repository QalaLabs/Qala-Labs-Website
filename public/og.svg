<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Blue accent bar -->
  <rect x="80" y="80" width="6" height="80" fill="#2563eb" rx="3" />

  <!-- Tagline -->
  <text x="108" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#2563eb" letter-spacing="4" text-transform="uppercase">PERFORMANCE MARKETING · AI AUTOMATION</text>

  <!-- Main headline -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-2">Scale Your DTC Brand</text>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#2563eb" letter-spacing="-2">to 8-Figures.</text>

  <!-- Subline -->
  <text x="80" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">Revenue growth agency for DTC brands in India.</text>
  <text x="80" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">Meta Ads · Google Shopping · Amazon · AI Automation</text>

  <!-- Divider -->
  <line x1="80" y1="500" x2="400" y2="500" stroke="#2563eb" stroke-width="2" opacity="0.4" />

  <!-- Domain -->
  <text x="80" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#64748b">qalalabs.com</text>

  <!-- Logo circle placeholder -->
  <circle cx="1100" cy="315" r="80" fill="#2563eb" opacity="0.15" />
  <circle cx="1100" cy="315" r="50" fill="#2563eb" opacity="0.25" />
  <text x="1100" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">QL</text>
</svg>
